<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Mantenha o connect-src igual ao apiBase do config.js. Não há scripts nem estilos inline. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src https://servicodados.ibge.gov.br https://power.larc.nasa.gov http://localhost:8787 http://127.0.0.1:8787; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Monitor Cinder · Padrões históricos de fogo em Goiás</title>
  <link rel="stylesheet" href="mapa.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div class="brand__text"><strong>Monitor Cinder</strong><span data-i18n="brand.sub"></span></div>
    </div>
    <div id="source-badge" class="badge" role="status" data-i18n="badge.loading"></div>
    <div class="controls">
      <label class="field"><span data-i18n="field.metric"></span>
        <select id="metric">
          <option value="anomaly" data-i18n="metric.anomaly"></option>
          <option value="count" data-i18n="metric.count"></option>
          <option value="density" data-i18n="metric.density"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="field.year"></span> <select id="year"></select></label>
      <label class="field"><span data-i18n="field.month"></span> <select id="month"></select></label>
      <div class="search">
        <input id="search" type="search" autocomplete="off" spellcheck="false" maxlength="60"
               data-i18n-attr="placeholder:search.ph;aria-label:search.aria"
               role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list">
        <ul id="search-list" class="search__list" role="listbox" hidden></ul>
      </div>
      <button id="lang" class="icon-btn icon-btn--text" type="button" data-i18n="lang.btn" data-i18n-attr="aria-label:lang.aria;title:lang.aria"></button>
      <button id="theme" class="icon-btn" type="button" data-i18n-attr="aria-label:theme.aria;title:theme.aria">☾</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" data-i18n-attr="aria-label:map.aria">
      <div id="map" class="map"></div>
      <div id="tooltip" class="tooltip" hidden><strong id="tt-name"></strong><span id="tt-value"></span><span id="tt-extra" class="tt-row" hidden></span><span id="tt-hint" class="tt-hint" hidden></span></div>

      <!-- Seletor de Modo: Município vs Esfera (Área) -->
      <div class="mode-hud" role="group" data-i18n-attr="aria-label:mode.aria">
        <button id="mode-muni" class="mode-btn is-active" type="button" data-i18n="mode.muni" data-i18n-attr="title:mode.muniTitle"></button>
        <button id="mode-sphere" class="mode-btn" type="button" data-i18n="mode.sphere" data-i18n-attr="title:mode.sphereTitle"></button>
        <div id="sphere-controls" class="sphere-controls" hidden>
          <label class="sphere-slider-label">
            <span data-i18n="mode.radius"></span>
            <input id="sphere-radius" type="range" min="5" max="260" step="5" value="85">
            <strong id="sphere-radius-val">85 km</strong>
          </label>
          <small class="sphere-hint" data-i18n="mode.hint"></small>
        </div>
      </div>

      <!-- Ferramentas de Navegação e Camadas -->
      <div class="map-tools" role="group">
        <button id="zoom-in" class="icon-btn" type="button" data-i18n-attr="aria-label:zoom.in;title:zoom.in">+</button>
        <button id="zoom-out" class="icon-btn" type="button" data-i18n-attr="aria-label:zoom.out;title:zoom.out">−</button>
        <button id="zoom-reset" class="icon-btn icon-btn--tag" type="button" data-i18n-attr="aria-label:zoom.reset;title:zoom.reset">GO</button>
        <button id="zoom-brazil" class="icon-btn icon-btn--tag" type="button" data-i18n-attr="aria-label:zoom.brazil;title:zoom.brazil">BR</button>
        <button id="toggle-numbers" class="icon-btn icon-btn--tag is-active" type="button" data-i18n-attr="aria-label:zoom.numbers;title:zoom.numbers">Nº</button>
        <button id="toggle-roots" class="icon-btn icon-btn--tag" type="button" aria-pressed="false" data-i18n-attr="aria-label:roots.btn;title:roots.btn">FR</button>
      </div>

      <!-- Proporção e Escala Cartográfica Lateral -->
      <aside id="scale-lateral" class="scale-lateral" aria-hidden="true">
        <div class="scale-lateral__head">
          <span class="scale-lateral__title" data-i18n="scale.title"></span>
          <strong id="scale-zoom" class="scale-lateral__zoom">1.0×</strong>
        </div>
        <div id="scale-ratio" class="scale-lateral__ratio">1 : 4.5M</div>
        <div class="scale-lateral__body">
          <div class="scale-lateral__track">
            <div id="scale-bar-fill" class="scale-lateral__fill"></div>
          </div>
          <div class="scale-lateral__ticks">
            <span id="scale-top-km">0 km</span>
            <span id="scale-mid-km">50 km</span>
            <span id="scale-bot-km">100 km</span>
          </div>
        </div>
        <div id="scale-span" class="scale-lateral__foot"></div>
      </aside>

      <figure class="legend">
        <figcaption id="legend-title"></figcaption>
        <canvas id="legend-canvas" width="240" height="10" aria-hidden="true"></canvas>
        <div id="legend-ticks" class="legend__ticks"></div>
        <div class="legend__nodata"><span class="swatch"></span><span data-i18n="legend.nodata"></span></div>
        <div id="roots-legend" class="roots-legend" hidden>
          <span id="roots-title"></span>
          <div id="roots-keys" class="roots-legend__keys"></div>
          <small id="roots-hit" class="muted"></small>
        </div>
      </figure>
      <button id="reopen" class="reopen-chip" type="button" hidden></button>
      <div id="panel-empty" class="map-hint" role="note">
        <strong data-i18n="empty.title"></strong>
        <span data-i18n="empty.p1"></span>
      </div>
      <div id="status" class="status" role="alert" hidden>
        <span id="status-text"></span>
        <button id="status-retry" class="btn" type="button" data-i18n="status.retry" hidden></button>
      </div>
    </section>

    <div id="panel" class="modal" hidden>
      <div class="modal__backdrop" data-close="1"></div>
      <div id="panel-body" class="modal__card" role="dialog" aria-modal="true" aria-labelledby="p-name" tabindex="-1" hidden>
        <header class="modal__head">
          <div>
            <h2 id="p-name"></h2>
            <p id="p-sub" class="muted"></p>
          </div>
          <div class="modal__actions">
            <button id="p-min" class="btn" type="button" data-i18n="panel.showMap" data-i18n-attr="title:panel.showMapTitle"></button>
            <button id="p-close" class="icon-btn" type="button" data-i18n-attr="aria-label:panel.close;title:panel.close">×</button>
          </div>
        </header>

        <nav class="tabs" role="tablist" data-i18n-attr="aria-label:tabs.aria">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="tab-summary" id="t-summary" data-tab="summary" data-i18n="tab.summary"></button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-projection" id="t-projection" data-tab="projection" data-i18n="tab.projection"></button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-history" id="t-history" data-tab="history" data-i18n="tab.history"></button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-area" id="t-area" data-tab="area" data-i18n="tab.area"></button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-context" id="t-context" data-tab="context" data-i18n="tab.context"></button>
        </nav>

        <div class="modal__body">
          <section id="tab-summary" class="tabpane" role="tabpanel" aria-labelledby="t-summary">
            <div class="kpis">
              <div class="kpi">
                <span class="kpi__label" id="k-period"></span>
                <strong id="k-count">–</strong>
                <small data-i18n="kpi.unit"></small>
              </div>
              <div class="kpi">
                <span class="kpi__label" data-i18n="kpi.anomaly"></span>
                <strong id="k-z">–</strong>
                <small id="k-z-text"></small>
              </div>
            </div>
            <section class="block">
              <h3><span data-i18n="block.range"></span> <small id="range-small"></small></h3>
              <div id="range-box" class="range-box"></div>
            </section>
            <section class="block">
              <h3><span data-i18n="block.next"></span> <small data-i18n="block.nextSmall"></small></h3>
              <div id="next-box" class="next-box"></div>
            </section>
          </section>

          <section id="tab-projection" class="tabpane" role="tabpanel" aria-labelledby="t-projection" hidden>
            <div id="horizons-box" class="horizons"></div>
          </section>

          <section id="tab-history" class="tabpane" role="tabpanel" aria-labelledby="t-history" hidden>
            <section class="block">
              <h3><span data-i18n="cal.title"></span> <small data-i18n="cal.titleSmall"></small></h3>
              <div class="cal-nav">
                <button id="cal-prev" class="icon-btn" type="button" data-i18n-attr="aria-label:cal.prev;title:cal.prev">‹</button>
                <strong id="cal-year" class="cal-nav__year"></strong>
                <button id="cal-next" class="icon-btn" type="button" data-i18n-attr="aria-label:cal.next;title:cal.next">›</button>
              </div>
              <div id="cal-months" class="cal-months"></div>
              <div id="cal-month" class="cal-month" aria-live="polite"></div>
            </section>
            <section class="block">
              <h3><span data-i18n="block.pattern"></span> <small data-i18n="block.patternSmall"></small></h3>
              <p id="season-text" class="lead"></p>
              <div id="pattern" class="pattern"></div>
            </section>
            <details class="block cal-all">
              <summary><span data-i18n="cal.allYears"></span> <small data-i18n="block.calendarSmall"></small></summary>
              <div id="calendar" class="calendar"></div>
            </details>
            <section class="block">
              <h3><span data-i18n="block.compare"></span> <small data-i18n="block.compareSmall"></small></h3>
              <div id="compare" class="compare"></div>
            </section>
          </section>

          <section id="tab-area" class="tabpane" role="tabpanel" aria-labelledby="t-area" hidden>
            <section id="detail-block" class="block" hidden>
              <h3><span data-i18n="block.detail"></span> <small id="detail-small"></small></h3>
              <div id="detail-box" class="detail-box"></div>
            </section>
            <section id="subareas-block" class="block" hidden>
              <h3><span id="subareas-title" data-i18n="block.subareas"></span> <small id="subareas-small" data-i18n="block.subareasSmall"></small></h3>
              <div id="subareas-list" class="subareas-list"></div>
            </section>
          </section>

          <section id="tab-context" class="tabpane" role="tabpanel" aria-labelledby="t-context" hidden>
            <section class="block">
              <h3><span data-i18n="block.context"></span> <small id="ctx-year"></small></h3>
              <ul id="context" class="context"></ul>
            </section>
            <div class="actions">
              <button id="csv" class="btn btn--primary" type="button" data-i18n="csv"></button>
            </div>
          </section>

          <!-- Reviewed-inputs-only blocks (API answers 503 while disabled); kept hidden. -->
          <div hidden>
            <section class="block" hidden><div id="resources-box" class="intel-box"></div></section>
            <section class="block" hidden><div id="root-fires-box" class="intel-box"></div></section>
            <section class="block" hidden><div id="predictability-box" class="intel-box"></div></section>
            <section class="block" hidden><div id="agro-b2b-box" class="intel-box"></div></section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <span data-i18n="foot.firms"></span>
    <span data-i18n="foot.ibge"></span>
    <span data-i18n="foot.inpe"></span>
    <span data-i18n="foot.embrapa"></span>
    <span data-i18n="foot.power"></span>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="mapa-engine.js"></script>
  <script src="cinder-data.js"></script>
  <script src="cinder-ui.js"></script>
</body>
</html>
